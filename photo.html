<header class="d-head">
  <div class="wrap">
    
    <h1>攝影<small>舞台與日常</small></h1>
    <p class="lead">燈光每秒都在變，表演者不停移動，能按下快門的瞬間只有一次。我習慣先觀察燈光和走位的節奏，再等那一刻。</p>
  </div>
</header>

<main class="d-body">
  <div class="wrap">

      
      <h3 class="ph-h">舞台</h3>
      <div class="photos">
        <figure class="ph"><img src="img/photo-01.jpg" alt="演唱會場館全景：舞台上方的環形燈陣與觀眾席的手機燈光"></figure>
        <figure class="ph"><img src="img/photo-02.jpg" alt="四位樂團成員在舞台上一起鞠躬"></figure>
        <figure class="ph"><img src="img/photo-03.jpg" alt="橘髮歌手手按胸口演唱"></figure>
        <figure class="ph"><img src="img/photo-04.jpg" alt="紙飛機從空中落下，樂團成員抬頭看"></figure>
        <figure class="ph"><img src="img/photo-05.jpg" alt="綠色燈光下，歌手走到觀眾席旁"></figure>
        <figure class="ph"><img src="img/photo-06.jpg" alt="彩帶飛舞中，樂團成員舉手歡呼"></figure>
        <figure class="ph"><img src="img/photo-07.jpg" alt="藍色燈光中戴墨鏡的歌手"></figure>
        <figure class="ph"><img src="img/photo-08.jpg" alt="黃色紙片落下，四人在舞台上大笑"></figure>
        <figure class="ph"><img src="img/photo-09.jpg" alt="吉他手靠在主唱肩上一起演唱"></figure>
        <figure class="ph"><img src="img/photo-10.jpg" alt="紫色燈光前戴墨鏡的歌手"></figure>
        <figure class="ph"><img src="img/photo-11.jpg" alt="戶外舞台上揮手微笑的表演者"></figure>
        <figure class="ph"><img src="img/photo-12.jpg" alt="橘髮表演者在台前蹲下靠近觀眾"></figure>
        <figure class="ph"><img src="img/photo-13.jpg" alt="穿制服的表演者比愛心微笑"></figure>
        <figure class="ph"><img src="img/photo-14.jpg" alt="穿白色西裝的表演者揮手"></figure>
        <figure class="ph"><img src="img/photo-15.jpg" alt="2026 資工之夜舞蹈表演"></figure>
      </div>
      <h3 class="ph-h">日常</h3>
      <div class="photos">
        <figure class="ph"><img src="img/photo-18.jpg" alt="陽光從木窗灑進洗手台，橘色臉盆疊在綠色籃子上"></figure>
        <figure class="ph"><img src="img/photo-17.jpg" alt="午後的商店街，招牌林立"></figure>
        <figure class="ph"><img src="img/photo-19.jpg" alt="在木櫃上睡覺的三花貓"></figure>
        <figure class="ph"><img src="img/photo-20.jpg" alt="拿在手上的糖葫蘆，背景是整排水果串"></figure>
        <figure class="ph"><img src="img/photo-21.jpg" alt="夕陽下停泊在碼頭的漁船船頭與繫纜柱"></figure>
        <figure class="ph"><img src="img/photo-16.jpg" alt="社區公園的溜滑梯與街邊洗衣店"></figure>
        <figure class="ph"><img src="img/photo-22.jpg" alt="消波塊前倒映金光的海浪"></figure>
